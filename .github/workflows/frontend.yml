name: Frontend CI/CD (S3 + CloudFront)

on:
  push:
    branches: [main]
    paths: ['frontend/**']      # only when frontend code changes
  workflow_dispatch:            # allow manual deploys from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Vite bakes VITE_API_URL into the bundle at BUILD time, so the EC2
      # backend URL must be passed here — not at runtime like the old Docker
      # container did.
      - name: Build static frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://${{ secrets.EC2_HOST }}:5000

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Uploads frontend/dist to S3 and invalidates CloudFront. Requires the
      # one-time setup: ./scripts/setup-frontend-hosting.sh
      - name: Deploy to S3 + CloudFront
        run: bash scripts/deploy-frontend-s3.sh
        env:
          API_URL: http://${{ secrets.EC2_HOST }}:5000
          S3_BUCKET: ${{ secrets.S3_BUCKET }}                       # optional — a default is computed
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}  # optional — auto-discovered by tag
